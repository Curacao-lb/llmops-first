services:
  llmops-ui:
    image: llmops-ui:0.1.0
    build:
      context: ../../llmops-ui
      dockerfile: Dockerfile
    container_name: llmops-ui
    restart: always
    ports:
      - "5173:80"

  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: llmops-mailpit
    restart: unless-stopped
    environment:
      # Accept the demo app's placeholder SMTP credentials on the internal
      # Compose network; Mailpit captures messages instead of delivering them.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"

  llmops-api:
    image: llmops-api:1.0.0
    build:
      # This compose file is in docker/, and the Dockerfile is at the repo root.
      context: ..
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: llmops-api
    restart: always
    env_file:
      - ./.env
    environment:
      MODE: api
      SERVER_WORKER_AMOUNT: "4"
      SERVER_THREAD_AMOUNT: "4"
      MIGRATION_ENABLED: "true"
      WTF_CSRF_ENABLED: "false"
      SQLALCHEMY_DATABASE_URI: "postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@llmops-db:5432/llmops?client_encoding=utf8"
      SQLALCHEMY_POOL_SIZE: "30"
      SQLALCHEMY_POOL_RECYCLE: "3600"
      SQLALCHEMY_ECHO: "false"
      REDIS_HOST: llmops-redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}
      REDIS_DB: "0"
      REDIS_USE_SSL: "false"
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_HOST: weaviate
      WEAVIATE_GRPC_PORT: "50051"
      CELERY_BROKER_DB: "1"
      CELERY_RESULT_BACKEND_DB: "1"
      CELERY_TASK_IGNORE_RESULT: "true"
      CELERY_RESULT_EXPIRES: "3600"
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "true"
      TRANSFORMERS_OFFLINE: "0"
    volumes:
      - ./volumes/app/storage:/app/api/storage
      - ../private.pem:/app/api/private.pem:ro
    ports:
      - "5001:5001"
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy
      weaviate:
        condition: service_started
      mailpit:
        condition: service_started

  llmops-worker:
    image: llmops-api:1.0.0
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: llmops-worker
    restart: always
    env_file:
      - ./.env
    environment:
      MODE: celery
      CELERY_WORKER_CLASS: prefork
      CELERY_WORKER_AMOUNT: "5"
      MIGRATION_ENABLED: "false"
      SQLALCHEMY_DATABASE_URI: "postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}@llmops-db:5432/llmops?client_encoding=utf8"
      REDIS_HOST: llmops-redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in docker/.env}
      REDIS_DB: "0"
      REDIS_USE_SSL: "false"
      WEAVIATE_HTTP_HOST: weaviate
      WEAVIATE_HTTP_PORT: "8080"
      WEAVIATE_GRPC_HOST: weaviate
      WEAVIATE_GRPC_PORT: "50051"
      CELERY_BROKER_DB: "1"
      CELERY_RESULT_BACKEND_DB: "1"
      CELERY_TASK_IGNORE_RESULT: "true"
      CELERY_RESULT_EXPIRES: "3600"
      CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "true"
      TRANSFORMERS_OFFLINE: "0"
    volumes:
      - ./volumes/app/storage:/app/api/storage
    depends_on:
      llmops-db:
        condition: service_healthy
      llmops-redis:
        condition: service_healthy
      weaviate:
        condition: service_started
      mailpit:
        condition: service_started

  llmops-redis:
    image: redis:6-alpine
    restart: always
    container_name: llmops-redis
    env_file:
      - ./.env
    volumes:
      - ./volumes/redis/data:/data
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.8
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1

  llmops-db:
    image: postgres:16.3-alpine
    restart: always
    container_name: llmops-db
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: llmops
    volumes:
      # Reuse the existing PostgreSQL 16 data directory under docker/volumes/db/data.
      - ./volumes/db/data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llmops"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

volumes:
  weaviate_data:
    # Reuse the volume created by the earlier root-level Compose setup.
    name: llmops-api_weaviate_data
